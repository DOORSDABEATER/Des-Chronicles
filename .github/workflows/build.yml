
name: Build Minecraft Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract plugin source
        run: |
          mkdir -p source
          unzip -q "DeS-Chronicles-phase1 (1).zip" -d source
          test -f source/build.gradle.kts || test -f source/build.gradle

      - name: Build Plugin
        run: gradle -p source clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeS-Chronicles-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
